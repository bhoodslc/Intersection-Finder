<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Intersection Finder</title>

<!-- Home Screen / standalone app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intersections">
<meta name="theme-color" content="#14161A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2314161A'/%3E%3Crect x='58' y='18' width='64' height='144' rx='10' fill='%2323272E' stroke='%23FFD200' stroke-width='5'/%3E%3Ccircle cx='90' cy='52' r='18' fill='%23E3352E'/%3E%3Ccircle cx='90' cy='90' r='18' fill='%23FFB200'/%3E%3Ccircle cx='90' cy='128' r='18' fill='%2300B24F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --night: #14161A;
    --housing: #23272E;
    --housing-hi: #2E333B;
    --backplate: #1A1D22;
    --visor: #0E1013;

    --sig-red: #E3352E;
    --sig-amber: #FFB200;
    --sig-green: #00B24F;
    --reflect: #FFD200;

    --panel: #1E2229;
    --panel-line: #343A43;
    --text: #E8EAED;
    --text-soft: #9BA3AE;
    --text-dim: #6B727C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--night);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    /* Faint mast-arm gradient behind everything */
    background:
      radial-gradient(ellipse at 50% 0%, #1D212A 0%, var(--night) 55%);
  }

  /* ================= HEADER: signal head ================= */
  header {
    padding: 18px 20px 20px;
    padding-top: calc(18px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--panel-line);
    position: relative;
  }

  /* Yellow retroreflective stripe, like a backplate edge */
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: repeating-linear-gradient(
      90deg,
      var(--reflect) 0 14px,
      #B89400 14px 28px
    );
    opacity: 0.85;
  }

  /* --- The signal head itself --- */
  .signal-head {
    width: 46px;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--housing-hi), var(--housing));
    border: 2.5px solid var(--reflect);
    border-radius: 7px;
    padding: 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    box-shadow:
      0 3px 10px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .lens {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--visor);
    border: 1.5px solid #000;
    position: relative;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  /* Lit states — only one active at a time */
  .lens.on.red {
    background: radial-gradient(circle at 35% 32%, #FF7A72, var(--sig-red) 62%);
    box-shadow: 0 0 14px 2px rgba(227,53,46,0.75);
  }
  .lens.on.amber {
    background: radial-gradient(circle at 35% 32%, #FFD87A, var(--sig-amber) 62%);
    box-shadow: 0 0 14px 2px rgba(255,178,0,0.75);
  }
  .lens.on.green {
    background: radial-gradient(circle at 35% 32%, #6BE8A2, var(--sig-green) 62%);
    box-shadow: 0 0 14px 2px rgba(0,178,79,0.7);
  }

  /* Amber flashes while a lookup is running */
  @keyframes flash {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
  .lens.flashing { animation: flash 0.85s steps(1, end) infinite; }

  .title-block { min-width: 0; }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.045em;
    text-transform: uppercase;
    font-size: 21px;
    line-height: 1.1;
    color: var(--text);
    margin: 0;
  }

  .tagline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 5px;
  }

  /* ================= MAIN ================= */
  main {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Controller-cabinet style panel */
  .form-card,
  .choices,
  .result-card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.4);
  }

  .form-card { padding: 18px 18px 20px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--reflect);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--panel-line);
  }

  .street-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }

  label {
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-soft);
  }

  input {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 12px 13px;
    border: 1.5px solid var(--panel-line);
    border-radius: 4px;
    background: #16191E;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder { color: var(--text-dim); }
  input:focus {
    border-color: var(--reflect);
    box-shadow: 0 0 0 3px rgba(255,210,0,0.12);
  }

  /* "&" divider styled like a stop bar */
  .and-glyph {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.1em;
    user-select: none;
    position: relative;
    margin: -1px 0;
  }
  .and-glyph::before,
  .and-glyph::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 40%;
    height: 2px;
    background: repeating-linear-gradient(
      90deg,
      var(--panel-line) 0 6px,
      transparent 6px 12px
    );
  }
  .and-glyph::before { left: 0; }
  .and-glyph::after { right: 0; }

  .city-field { margin-top: 14px; }

  /* GO button — green signal */
  button.search-btn {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 4px;
    background: linear-gradient(180deg, #00C458, var(--sig-green));
    color: #04240F;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(0,178,79,0.28);
    transition: filter 0.15s ease, box-shadow 0.15s ease;
  }
  button.search-btn:active {
    filter: brightness(0.85);
    box-shadow: none;
  }
  button.search-btn:disabled {
    background: #2A2F36;
    color: var(--text-dim);
    box-shadow: none;
    cursor: default;
  }

  /* ================= STATUS ================= */
  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.5;
    padding: 13px 15px;
    border-radius: 4px;
    display: none;
    background: var(--panel);
  }
  .status.show { display: block; }
  .status.error {
    color: #FF8078;
    border-left: 4px solid var(--sig-red);
  }
  .status.loading {
    color: var(--sig-amber);
    border-left: 4px solid var(--sig-amber);
  }

  /* ================= CANDIDATE PICKER ================= */
  .choices {
    display: none;
    overflow: hidden;
  }
  .choices.show { display: block; }

  .choices-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--reflect);
    padding: 15px 16px 12px;
    border-bottom: 1px solid var(--panel-line);
  }

  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--panel-line);
    padding: 14px 16px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .choice:last-child { border-bottom: none; }
  .choice:active { background: #262B33; }

  .choice-name {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    letter-spacing: 0.02em;
  }

  .choice-detail {
    font-size: 12.5px;
    color: var(--text-soft);
    line-height: 1.4;
  }

  /* ================= RESULT ================= */
  .result-card {
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .result-card.show { display: flex; }

  #map {
    width: 100%;
    height: 260px;
    background: #0E1013;
    border-bottom: 3px solid var(--reflect);
  }

  .result-info { padding: 17px 18px 18px; }

  .result-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--text-dim);
    margin-bottom: 5px;
  }

  .result-address {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
    line-height: 1.3;
    color: var(--text);
  }

  .approx-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    line-height: 1.55;
    color: var(--sig-amber);
    background: rgba(255,178,0,0.08);
    border-left: 3px solid var(--sig-amber);
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 15px;
  }

  .directions-row {
    display: flex;
    gap: 10px;
  }

  .directions-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 13px 10px;
    border-radius: 4px;
    text-decoration: none;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1.5px solid transparent;
  }

  .directions-btn.apple {
    background: linear-gradient(180deg, #00C458, var(--sig-green));
    color: #04240F;
  }
  .directions-btn.google {
    background: linear-gradient(180deg, #00C458, var(--sig-green));
    color: #04240F;
  }
  .directions-btn.apple:active { filter: brightness(0.85); }
  .directions-btn.google:active { filter: brightness(0.85); }

  /* ================= FOOTER ================= */
  footer {
    text-align: center;
    padding: 16px 14px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-top: 1px solid var(--panel-line);
  }

  .leaflet-marker-icon.pulse {
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
  }
  /* Dark-mode the map tiles so they sit in the cabinet aesthetic */
  .leaflet-tile-pane { filter: brightness(0.78) saturate(0.75) contrast(1.05); }
  .leaflet-control-zoom a {
    background: var(--panel) !important;
    color: var(--text) !important;
    border-color: var(--panel-line) !important;
  }
</style>
</head>
<body>

<header>
  <div class="signal-head" id="signalHead">
    <div class="lens red on" id="lensRed"></div>
    <div class="lens amber" id="lensAmber"></div>
    <div class="lens green" id="lensGreen"></div>
  </div>
  <div class="title-block">
    <h1>Intersection<br>Finder</h1>
    <div class="tagline">Cross streets &middot; not addresses</div>
  </div>
</header>

<main>
  <div class="form-card">
    <div class="eyebrow">Approach 1 &amp; Approach 2</div>
    <div class="street-row">
      <div class="field">
        <label for="street1">Street 1</label>
        <input id="street1" type="text" placeholder="e.g. Pomona Ave" autocomplete="off">
      </div>
      <div class="and-glyph">&amp;</div>
      <div class="field">
        <label for="street2">Street 2</label>
        <input id="street2" type="text" placeholder="e.g. Victoria St" autocomplete="off">
      </div>
    </div>
    <div class="field city-field">
      <label for="city">City, State</label>
      <input id="city" type="text" placeholder="e.g. Costa Mesa, CA" autocomplete="off">
    </div>
    <button class="search-btn" id="searchBtn">Find intersection</button>
  </div>

  <div class="status" id="status"></div>

  <div class="choices" id="choices">
    <div class="choices-header">Multiple matches &mdash; select one</div>
    <div id="choicesList"></div>
  </div>

  <div class="result-card" id="resultCard">
    <div id="map"></div>
    <div class="result-info">
      <div class="result-label">Matched location</div>
      <div class="result-address" id="resultAddress">&mdash;</div>
      <div class="approx-note">Pin is approximate. The directions buttons search Maps by street name, so they'll be more precise than the pin.</div>
      <div class="directions-row">
        <a class="directions-btn apple" id="appleLink" href="#" target="_blank" rel="noopener">Apple Maps</a>
        <a class="directions-btn google" id="googleLink" href="#" target="_blank" rel="noopener">Google Maps</a>
      </div>
    </div>
  </div>
</main>

<footer>Intersection Finder &middot; ITS Field Tool</footer>

<script>
  /* ============================================================
     CONFIGURATION — the only line you need to change later.

     When your Google Cloud billing is approved and you have an
     API key, paste it between the quotes below. Nothing else in
     this file needs to change. Leave it empty and the app falls
     back to the approximate AI lookup it uses today.

     Example:
       const GOOGLE_API_KEY = "AIzaSyB1cD3fGh...";
     ============================================================ */
  const GOOGLE_API_KEY = "AIzaSyCWGTggb9PMjilOJWQ2ua7H-3nWDFPkjhc";

  let map, marker;

  /* Drives the header signal head: red = idle/error, flashing amber =
     lookup running, green = intersection found. */
  function setSignal(phase) {
    const lenses = {
      red: document.getElementById('lensRed'),
      amber: document.getElementById('lensAmber'),
      green: document.getElementById('lensGreen')
    };
    Object.values(lenses).forEach(l => l.classList.remove('on', 'flashing'));

    if (phase === 'searching') {
      lenses.amber.classList.add('on', 'flashing');
    } else if (phase === 'found') {
      lenses.green.classList.add('on');
    } else {
      lenses.red.classList.add('on');
    }
  }

  /* Loads the Maps JavaScript API once, on demand. Unlike the server-side
     Geocoding API, this one is designed for browsers and works with HTTP
     referrer restrictions — which is what keeps the key safe on a public page.

     Note: script.onload only means the loader arrived, NOT that the libraries
     are ready. We must await importLibrary() as well, or the first call fails. */
  let googleLoader = null;
  function loadGoogleMaps() {
    if (googleLoader) return googleLoader;

    googleLoader = new Promise((resolve, reject) => {
      if (window.google && window.google.maps && window.google.maps.importLibrary) {
        resolve();
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(GOOGLE_API_KEY) + '&loading=async&libraries=geocoding';
      script.async = true;
      script.onerror = () => reject(new Error('Google says: SCRIPT_LOAD_FAILED — check that the Maps JavaScript API is enabled and the key allows this site.'));
      script.onload = () => resolve();
      document.head.appendChild(script);
    }).then(async () => {
      // Wait for the actual library objects, not just the loader script.
      await google.maps.importLibrary('geocoding');
    });

    return googleLoader;
  }

  async function geocodeViaGoogle(s1, s2, city) {
    await loadGoogleMaps();

    const query = s1 + ' and ' + s2 + ', ' + city;
    const geocoder = new google.maps.Geocoder();

    const response = await new Promise((resolve, reject) => {
      geocoder.geocode({ address: query }, (results, status) => {
        if (status === 'OK') {
          resolve(results);
        } else if (status === 'ZERO_RESULTS') {
          resolve([]);
        } else {
          reject(new Error('Google says: ' + status));
        }
      });
    });

    if (!response || response.length === 0) {
      return { found: false, candidates: [], note: 'No match in the Google geocoding database.' };
    }

    const candidates = response.slice(0, 4).map(r => ({
      lat: r.geometry.location.lat(),
      lon: r.geometry.location.lng(),
      label: r.formatted_address.split(',')[0],
      detail: r.formatted_address,
      mapsQuery: r.formatted_address,
      precise: true
    }));

    return { found: true, candidates, note: '' };
  }

  function setStatus(text, type) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status show' + (type ? ' ' + type : '');
  }

  function clearStatus() {
    const el = document.getElementById('status');
    el.className = 'status';
  }

  function showResult(lat, lon, label, mapsQuery, precise) {
    setSignal('found');
    document.getElementById('choices').classList.remove('show');
    document.getElementById('resultCard').classList.add('show');
    document.getElementById('resultAddress').textContent = label;

    // Google coordinates are survey-grade; the AI fallback is not.
    document.querySelector('.approx-note').style.display = precise ? 'none' : 'block';

    // Send Maps the street names, not our approximate coordinates — Apple and
    // Google geocode intersections far more accurately than we can here.
    const q = encodeURIComponent(mapsQuery || label);
    document.getElementById('appleLink').href =
      'https://maps.apple.com/?daddr=' + q;
    document.getElementById('googleLink').href =
      'https://www.google.com/maps/dir/?api=1&destination=' + q;

    if (!map) {
      map = L.map('map', { zoomControl: false }).setView([lat, lon], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
    } else {
      map.setView([lat, lon], 17);
    }

    const icon = L.divIcon({
      className: 'pulse',
      html: '<div style="width:22px;height:22px;border-radius:50%;background:#F2A900;border:3px solid #1B1D1F;"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    if (marker) marker.remove();
    marker = L.marker([lat, lon], { icon }).addTo(map);

    setTimeout(() => map.invalidateSize(), 50);
  }

  function renderChoices(candidates) {
    const list = document.getElementById('choicesList');
    list.innerHTML = '';

    candidates.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice';

      const name = document.createElement('div');
      name.className = 'choice-name';
      name.textContent = c.label || 'Intersection';

      const detail = document.createElement('div');
      detail.className = 'choice-detail';
      detail.textContent = c.detail || '';

      btn.appendChild(name);
      if (c.detail) btn.appendChild(detail);
      btn.addEventListener('click', () => {
        showResult(c.lat, c.lon, c.label || 'Intersection', c.mapsQuery, c.precise);
      });

      list.appendChild(btn);
    });

    document.getElementById('choices').classList.add('show');
  }

  async function geocodeIntersection(s1, s2, city) {
    const prompt =
      'Find real street intersections matching this input. Treat the input as case-insensitive and ' +
      'street-suffix-optional: the user may type "pomona", "Pomona Ave", "POMONA AVENUE", or "Pomona Av" ' +
      'and all should match the same street. Infer the correct suffix yourself.\n\n' +
      'Street A: "' + s1 + '"\nStreet B: "' + s2 + '"\nCity: "' + city + '"\n\n' +
      'Use web search to verify. If more than one distinct intersection plausibly matches — for example ' +
      'the city has both a "Victoria St" and a "Victoria Ave" that each cross Street A, or the streets ' +
      'cross more than once — return every plausible candidate, most likely first, up to 4.\n\n' +
      'Respond with ONLY a JSON object, no markdown fences and no commentary. Format exactly:\n' +
      '{"found": true, "candidates": [{"lat": 33.12345, "lon": -117.12345, ' +
      '"label": "Pomona Ave & Victoria St", "detail": "Costa Mesa, CA 92627 — signalized intersection", ' +
      '"mapsQuery": "Pomona Ave & Victoria St, Costa Mesa, CA"}], "note": "one short sentence on confidence"}\n\n' +
      'mapsQuery must be the fully spelled-out intersection with proper suffixes, city, and state abbreviation, ' +
      'suitable for pasting into Google or Apple Maps. If nothing matches, respond ' +
      '{"found": false, "candidates": [], "note": "why it could not be found"}.';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }],
        tools: [{ type: 'web_search_20250305', name: 'web_search' }]
      })
    });

    if (!response.ok) throw new Error('api_error');
    const data = await response.json();

    const text = (data.content || [])
      .filter(block => block.type === 'text')
      .map(block => block.text)
      .join('\n')
      .trim();

    const clean = text.replace(/```json|```/g, '').trim();
    const firstBrace = clean.indexOf('{');
    const lastBrace = clean.lastIndexOf('}');
    if (firstBrace === -1 || lastBrace === -1) throw new Error('parse_error');

    return JSON.parse(clean.slice(firstBrace, lastBrace + 1));
  }

  async function findIntersection() {
    const s1 = document.getElementById('street1').value.trim();
    const s2 = document.getElementById('street2').value.trim();
    const city = document.getElementById('city').value.trim();

    if (!s1 || !s2 || !city) {
      setSignal('idle');
      setStatus('Enter both cross streets and a city to search.', 'error');
      return;
    }

    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('choices').classList.remove('show');
    setSignal('searching');
    setStatus('Searching for ' + s1 + ' & ' + s2 + '…', 'loading');

    try {
      const result = GOOGLE_API_KEY
        ? await geocodeViaGoogle(s1, s2, city)
        : await geocodeIntersection(s1, s2, city);
      const candidates = (result && result.candidates) ? result.candidates.filter(
        c => c && c.lat != null && c.lon != null
      ) : [];

      if (!result || !result.found || candidates.length === 0) {
        clearStatus();
        const reason = (result && result.note) ? result.note : 'Check the spelling of both streets and the city.';
        setSignal('idle');
        setStatus("Couldn't find that intersection. " + reason, 'error');
        btn.disabled = false;
        return;
      }

      clearStatus();

      if (candidates.length === 1) {
        const c = candidates[0];
        showResult(c.lat, c.lon, c.label || (s1 + ' & ' + s2), c.mapsQuery, c.precise);
      } else {
        renderChoices(candidates);
      }
    } catch (err) {
      clearStatus();
      const msg = (err && err.message && err.message.indexOf('Google says') === 0)
        ? err.message
        : 'Something went wrong looking up that intersection. Try again in a moment.';
      setSignal('idle');
      setStatus(msg, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('searchBtn').addEventListener('click', findIntersection);
  document.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') findIntersection();
    });
  });

  // Warm up the Maps library in the background so the first search and the
  // first keystroke don't pay the loading cost.
  if (GOOGLE_API_KEY) {
    loadGoogleMaps().catch(err => console.warn('Preload failed:', err));
  }
</script>
